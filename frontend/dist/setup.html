<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API 配置 - 教案生成系统</title>
  <style>
    :root {
      --apple-blue: #007aff;
      --apple-green: #34c759;
      --apple-red: #ff3b30;
      --apple-orange: #ff9500;
      --apple-gray: #86868b;
      --apple-gray-2: #6e6e73;
      --apple-gray-3: #48484a;
      --apple-bg: #ffffff;
      --apple-bg-secondary: #f5f5f7;
      --apple-border: rgba(0,0,0,.08);
      --apple-shadow: 0 2px 8px rgba(0,0,0,.08);
      --apple-radius-lg: 20px;
      --apple-radius: 12px;
      --apple-transition: all .2s ease;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
      background: var(--apple-bg-secondary);
      color: var(--apple-gray-3);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container {
      width: 100%;
      max-width: 640px;
    }
    .header {
      text-align: center;
      margin-bottom: 32px;
    }
    .header .icon {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, var(--apple-blue), #5856d6);
      border-radius: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    .header .icon svg { width: 28px; height: 28px; color: #fff; }
    .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -.4px; }
    .header p { font-size: 14px; color: var(--apple-gray); margin-top: 6px; }
    .card {
      background: var(--apple-bg);
      border-radius: var(--apple-radius-lg);
      box-shadow: var(--apple-shadow);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--apple-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-header h2 { font-size: 17px; font-weight: 600; }
    .card-body { padding: 24px; }
    .model-selector {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .model-option {
      flex: 1;
      padding: 16px;
      border: 2px solid var(--apple-border);
      border-radius: var(--apple-radius);
      cursor: pointer;
      text-align: center;
      transition: var(--apple-transition);
    }
    .model-option:hover { border-color: var(--apple-gray); }
    .model-option.active {
      border-color: var(--apple-blue);
      background: #007aff08;
    }
    .model-option .model-name { font-size: 16px; font-weight: 600; color: var(--apple-gray-3); }
    .model-option .model-desc { font-size: 12px; color: var(--apple-gray); margin-top: 4px; }
    .model-option .check {
      display: none;
      width: 22px; height: 22px;
      background: var(--apple-blue);
      border-radius: 50%;
      margin: 8px auto 0;
      align-items: center;
      justify-content: center;
    }
    .model-option.active .check { display: inline-flex; }
    .model-option .check svg { width: 12px; height: 12px; color: #fff; }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--apple-gray-2);
      margin-bottom: 6px;
    }
    .form-group label .hint { font-weight: 400; color: var(--apple-gray); }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: var(--apple-bg-secondary);
      border: 1px solid transparent;
      border-radius: 10px;
      font-size: 15px;
      color: var(--apple-gray-3);
      transition: var(--apple-transition);
      font-family: inherit;
    }
    .form-group input:focus {
      outline: none;
      background: var(--apple-bg);
      border-color: var(--apple-blue);
      box-shadow: 0 0 0 3px rgba(0,122,255,.15);
    }
    .form-group input::placeholder { color: var(--apple-gray); }
    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 14px 24px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: var(--apple-transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--apple-blue);
      color: #fff;
    }
    .btn-primary:hover { background: #0066d6; }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--apple-bg-secondary);
      color: var(--apple-gray-2);
    }
    .btn-secondary:hover { background: #e8e8ed; }
    .toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 24px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 500;
      z-index: 999;
      opacity: 0;
      transition: opacity .3s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: #34c759; color: #fff; }
    .toast.error { background: var(--apple-red); color: #fff; }
    .toast.info { background: var(--apple-gray-3); color: #fff; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-badge.configured { background: #34c75920; color: var(--apple-green); }
    .status-badge.not-configured { background: #ff950020; color: var(--apple-orange); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .status-badge.configured .status-dot { background: var(--apple-green); }
    .status-badge.not-configured .status-dot { background: var(--apple-orange); }
    .back-link {
      text-align: center;
      margin-top: 8px;
    }
    .back-link a {
      color: var(--apple-blue);
      text-decoration: none;
      font-size: 14px;
    }
    .back-link a:hover { text-decoration: underline; }
    .info-box {
      padding: 14px 18px;
      background: #007aff0d;
      border-radius: 10px;
      font-size: 13px;
      color: var(--apple-gray-2);
      margin-top: 16px;
      line-height: 1.6;
    }
    .info-box strong { color: var(--apple-gray-3); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1>⚙️ 大模型 API 配置</h1>
      <p>配置完成后即可开始生成教案</p>
    </div>

    <div class="card">
      <div class="card-header">
        <span id="statusBadge" class="status-badge not-configured">
          <span class="status-dot"></span>
          <span id="statusText">未配置</span>
        </span>
        <span style="margin-left:auto;font-size:14px;color:var(--apple-gray);" id="currentModel"></span>
      </div>
      <div class="card-body">
        <!-- 模型选择 -->
        <div class="model-selector">
          <div class="model-option active" data-model="2" onclick="selectModel(2)">
            <div class="model-name">🔮 DeepSeek V3</div>
            <div class="model-desc">性价比高，推荐使用</div>
            <div class="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
          <div class="model-option" data-model="1" onclick="selectModel(1)">
            <div class="model-name">🤖 MiniMax</div>
            <div class="model-desc">MiniMax-M2.7 模型</div>
            <div class="check">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
          </div>
        </div>

        <!-- DeepSeek 配置 -->
        <div id="deepseekConfig">
          <div class="form-group">
            <label>DeepSeek API Key <span class="hint">（<a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:var(--apple-blue)">获取 Key</a>）</span></label>
            <input type="password" id="deepseekApiKey" placeholder="sk-xxxxxxxxxxxxxxxx" autocomplete="off" />
          </div>
          <div class="form-group">
            <label>API 地址 <span class="hint">（一般无需修改）</span></label>
            <input type="text" id="deepseekApiUrl" placeholder="https://api.deepseek.com/v1/chat/completions" />
          </div>
        </div>

        <!-- MiniMax 配置（默认隐藏） -->
        <div id="minimaxConfig" style="display:none;">
          <div class="form-group">
            <label>MiniMax API Key <span class="hint">（<a href="https://platform.minimaxi.com/user-center/basic-information/interface-key" target="_blank" style="color:var(--apple-blue)">获取 Key</a>）</span></label>
            <input type="password" id="minimaxApiKey" placeholder="sk-cp-xxxxxxxxxxxxxxxx" autocomplete="off" />
          </div>
          <div class="form-group">
            <label>API 地址 <span class="hint">（一般无需修改）</span></label>
            <input type="text" id="minimaxApiUrl" placeholder="https://api.minimaxi.com/v1/chat/completions" />
          </div>
        </div>

        <div class="btn-row">
          <button class="btn btn-primary" id="saveBtn" onclick="saveSettings()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            保存配置
          </button>
          <button class="btn btn-secondary" onclick="location.href='/'">
            返回首页
          </button>
        </div>

        <div class="info-box">
          <strong>💡 说明：</strong><br/>
          • 请至少填写一个模型的 API Key<br/>
          • API Key 保存在本地 <code>llm_settings.json</code> 文件中，不会上传到任何地方<br/>
          • 如果不知道 API 地址，保持默认即可<br/>
          • DeepSeek 注册即送免费额度，<strong>推荐使用</strong>
        </div>
      </div>
    </div>

    <div class="back-link">
      <a href="/">← 返回教案生成页面</a>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let selectedModel = 2;

    // 加载当前配置
    async function loadSettings() {
      try {
        const res = await fetch('/api/settings');
        const data = await res.json();
        if (data.success && data.settings) {
          const s = data.settings;
          selectedModel = s.model_selection || 2;
          selectModel(selectedModel, false);

          document.getElementById('deepseekApiKey').value = s.deepseek_api_key || '';
          document.getElementById('deepseekApiUrl').value = s.deepseek_api_url || 'https://api.deepseek.com/v1/chat/completions';
          document.getElementById('minimaxApiKey').value = s.minimax_api_key || '';
          document.getElementById('minimaxApiUrl').value = s.minimax_api_url || 'https://api.minimaxi.com/v1/chat/completions';

          updateStatus(s.api_key_configured);
        }
      } catch (e) {
        console.error('加载配置失败:', e);
      }
    }

    function selectModel(model, animate = true) {
      selectedModel = model;
      document.querySelectorAll('.model-option').forEach(el => {
        el.classList.toggle('active', el.dataset.model == model);
      });
      document.getElementById('deepseekConfig').style.display = model === 2 ? '' : 'none';
      document.getElementById('minimaxConfig').style.display = model === 1 ? '' : 'none';
      document.getElementById('currentModel').textContent = model === 2 ? '当前：DeepSeek V3' : '当前：MiniMax';
    }

    function updateStatus(configured) {
      const badge = document.getElementById('statusBadge');
      const text = document.getElementById('statusText');
      if (configured) {
        badge.className = 'status-badge configured';
        text.textContent = '已配置';
      } else {
        badge.className = 'status-badge not-configured';
        text.textContent = '未配置';
      }
    }

    async function saveSettings() {
      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border:2px solid transparent;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite"></span> 保存中...';

      const settings = {
        model_selection: selectedModel,
        deepseek_api_key: document.getElementById('deepseekApiKey').value.trim(),
        deepseek_api_url: document.getElementById('deepseekApiUrl').value.trim() || 'https://api.deepseek.com/v1/chat/completions',
        minimax_api_key: document.getElementById('minimaxApiKey').value.trim(),
        minimax_api_url: document.getElementById('minimaxApiUrl').value.trim() || 'https://api.minimaxi.com/v1/chat/completions',
      };

      try {
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(settings)
        });
        const data = await res.json();

        if (data.success) {
          showToast('✅ 配置保存成功！现在可以使用 ' + data.model_name + ' 生成教案了', 'success');
          updateStatus(true);
        } else {
          showToast('❌ ' + (data.message || '保存失败'), 'error');
        }
      } catch (e) {
        showToast('❌ 网络错误，请检查服务是否运行', 'error');
      }

      btn.disabled = false;
      btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg> 保存配置';
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = 'toast ' + type + ' show';
      setTimeout(() => { toast.classList.remove('show'); }, 3000);
    }

    // 页面加载
    loadSettings();
  </script>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
