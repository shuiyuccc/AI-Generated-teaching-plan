    <style>
      /* 大模型配置按钮 */
      .llm-config-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 48px;
        height: 48px;
        background: #007aff;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        z-index: 9999;
        box-shadow: 0 4px 16px rgba(0,122,255,.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all .2s ease;
      }
      .llm-config-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 24px rgba(0,122,255,.5);
      }
      .llm-config-btn:active {
        transform: scale(.95);
      }
      .llm-config-btn svg {
        width: 22px;
        height: 22px;
        color: #fff;
        transition: transform .3s ease;
      }
      .llm-config-btn:hover svg {
        transform: rotate(60deg);
      }
      .llm-config-tooltip {
        position: fixed;
        bottom: 80px;
        right: 24px;
        background: #1c1c1e;
        color: #fff;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 13px;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        pointer-events: none;
        opacity: 0;
        transform: translateY(4px);
        transition: all .2s ease;
        white-space: nowrap;
        z-index: 9999;
      }
      .llm-config-btn:hover + .llm-config-tooltip {
        opacity: 1;
        transform: translateY(0);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
